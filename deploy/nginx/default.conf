upstream seir_api {
    server backend:8000;
    keepalive 32;
}

upstream seir_web {
    server frontend:3000;
    keepalive 32;
}

# Basic abuse protection at the edge (the API enforces its own per-IP limits).
limit_req_zone $binary_remote_addr zone=seir_api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    location = /health/live {
        proxy_pass http://seir_api/health/live;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        limit_req zone=seir_api_limit burst=40 nodelay;

        proxy_pass http://seir_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /docs {
        proxy_pass http://seir_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://seir_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://seir_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
